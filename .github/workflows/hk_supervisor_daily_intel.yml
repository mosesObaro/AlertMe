name: Hong Kong PhD Daily Supervisor Intelligence

on:
  schedule:
    # Runs every day at 00:00 UTC (08:00 HKT)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: "Dispatch briefing alert via email"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests & Regression Verification
        run: |
          pytest tests/ -v

      - name: Generate Today's 7-Day Progressive Supervisor Briefing & Email Alert
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.send_email == false }}" = "true" ]; then
            python -m hk_supervisor_intel.cli generate-hk-supervisor-alert
          else
            python -m hk_supervisor_intel.cli generate-hk-supervisor-alert --send-email
          fi

      - name: Audit Recruitment Status & 12-Month Freshness
        run: |
          python -m hk_supervisor_intel.cli verify-hk-recruitment

      - name: Rebuild & Verify Master Excel Curriculum Workbook
        run: |
          python scratch/build_edge_curriculum.py

      - name: Upload Daily Intelligence Alert Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-phd-intelligence-alert
          path: alerts/daily/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit and Push Updated Campaign State
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hk_supervisor_intel/data/state.json alerts/daily/ Edge_Computing_PhD_Curriculum_Tracker.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update Hong Kong PhD supervisor intelligence state and daily alert [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Notice: Push conflict resolved or deferred to next scheduled run."
          fi
