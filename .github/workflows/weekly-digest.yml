name: Weekly Edge Computing PhD Research Briefing

on:
  schedule:
    - cron: "35 8 * * 0" # Every Sunday at 08:35 UTC (off-minute avoids GitHub Actions congestion)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Execute as dry-run (no email sent)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  weekly-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Digest Pipeline
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.cli run --mode weekly --dry-run
          else
            python -m src.cli run --mode weekly
          fi

      - name: Commit & Persist State Data
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(data): auto-update weekly research state [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Notice: Push conflict resolved or deferred to next scheduled run."
          fi
