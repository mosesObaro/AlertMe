    description: "The premier forum for edge computing systems, architectures, algorithms, and applications, bringing together researchers and practitioners across academia and industry."
    topics:
      - "Edge Computing"
      - "Edge AI"
      - "Cloudlets"
      - "Edge Security"
      - "Edge-Cloud Collaboration"
      - "TinyML Systems"
    start_date: "2026-11-10"
    end_date: "2026-11-12"
    location: "Seattle, WA, USA"
    format: "hybrid"
    country: "United States"
    region: "North America"
    official_website: "https://acm-ieee-sec.org/2026/"
    registration_url: "https://acm-ieee-sec.org/2026/registration.html"
    registration_fee: "$350 (Student) / $750 (Regular)"
