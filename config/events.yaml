# Edge Computing Events Configuration
# Covers Academic Conferences, Industry Conferences, Workshops & Symposia, Webinars, and Training/Bootcamps

events_settings:
  min_score: 6.5
  upcoming_window_days: 270 # Look ahead window for events
  daily_events_limit: 8
  weekly_events_limit: 10
  state_file: "data/events.json"
  seen_events_file: "data/seen_events.json"

search_specifications:
  primary_keywords:
    - "Edge Computing"
    - "Edge AI"
    - "Edge Intelligence"
    - "Mobile Edge Computing"
    - "Multi-access Edge Computing"
    - "MEC"
    - "Fog Computing"
    - "Cloud-Edge Continuum"
    - "Distributed Edge Systems"
    - "Federated Learning at the Edge"
    - "Device-Edge-Cloud"
    - "Computation Offloading"
    - "Cloudlets"
  secondary_keywords:
    - "Distributed Systems"
    - "Internet of Things"
    - "IoT"
    - "TinyML"
    - "Serverless Computing"
    - "Pervasive Computing"
    - "5G/6G Networks"
    - "Edge Security"
    - "Edge Storage"
    - "Edge Mesh"
    - "Microservices at the Edge"
  training_keywords:
    - "Bootcamp"
    - "Summer School"
    - "Winter School"
    - "Training Program"
    - "Hands-on Workshop"
    - "Tutorial"
    - "Certification"
    - "Doctoral Symposium"
  negative_keywords:
    - "crypto"
    - "bitcoin"
    - "nft"
    - "web development bootcamp"
    - "react js"
    - "css tips"
    - "affiliate marketing"
    - "real estate"
    - "dropshipping"

discount_rules:
  student_rate_keywords:
    - "student rate"
    - "student registration"
    - "student ticket"
    - "student discount"
    - "acm student member"
    - "ieee student member"
    - "graduate student"
    - "postgraduate"
  travel_grant_keywords:
    - "travel grant"
    - "student travel grant"
    - "stg"
    - "travel award"
    - "nsf travel grant"
    - "acm sigmobile travel grant"
    - "ieee comsoc travel grant"
    - "travel stipend"
  scholarship_keywords:
    - "scholarship"
    - "fellowship"
    - "diversity scholarship"
    - "inclusion grant"
    - "attendance grant"
  fee_waiver_keywords:
    - "fee waiver"
    - "hardship waiver"
    - "developing country"
    - "complimentary registration"
    - "free admission"
  early_bird_keywords:
    - "early bird"
    - "early-bird"
    - "advance registration"
    - "early registration"

event_feeds:
  - name: "WikiCFP Edge Computing"
    url: "http://www.wikicfp.com/cfp/rss?cat=edge%20computing"
    type: "rss"
    default_event_type: "academic_conference"
    tier: "tier3_conference"
    enabled: true

  - name: "WikiCFP Distributed Systems"
    url: "http://www.wikicfp.com/cfp/rss?cat=distributed%20systems"
    type: "rss"
    default_event_type: "academic_conference"
    tier: "tier3_conference"
    enabled: true

