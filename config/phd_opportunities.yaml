# PhD Opportunities & Dependant-Aware Scholarship Intelligence Configuration

phd_opportunities:
  enabled: true

  # 6 Explicitly Supported Target Countries with Authoritative Immigration References
  target_countries:
    - name: "Germany"
      code: "DE"
      currency: "EUR"
      immigration_dependant_guidance: "https://www.make-it-in-germany.com/en/visa-residence/family-reunification/spouses-joining-citizens-non-eu"
      dependant_visa_policy: "Dependants (spouse and minor children) are eligible for family reunification visa (Familiennachzug) if sufficient living funds and adequate health insurance are proven."
      immigration_disclaimer: "Dependants appear eligible under current published German residence act (§ 29-32 AufenthG); verify requirements before applying."

    - name: "Hong Kong"
      code: "HK"
      currency: "HKD"
      immigration_dependant_guidance: "https://www.immd.gov.hk/eng/services/visas/dependant_visa_entry_permit.html"
      dependant_visa_policy: "Full-time doctoral students in Hong Kong may sponsor their legal spouse and unmarried dependent children under 18 for dependant visas with right to study and reside."
      immigration_disclaimer: "Dependants appear eligible under current published Hong Kong Immigration Department guidance; verify requirements before applying."

    - name: "Canada"
      code: "CA"
      currency: "CAD"
      immigration_dependant_guidance: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/work/help-your-spouse-work.html"
      dependant_visa_policy: "Spouses/common-law partners of full-time doctoral (PhD) students remain eligible for an Open Work Permit (SOWP); dependent children may attend public school."
      immigration_disclaimer: "Dependants appear eligible under current published IRCC guidelines for doctoral students; verify requirements before applying."

    - name: "United Kingdom"
      code: "UK"
      currency: "GBP"
      immigration_dependant_guidance: "https://www.gov.uk/student-visa/family-members"
      dependant_visa_policy: "International postgraduate research (PhD/Doctoral) students are explicitly permitted to bring family dependants (partner and children) on Student Dependant Visas."
      immigration_disclaimer: "Dependants appear eligible under current published UK Visas and Immigration guidance for research doctorates; verify requirements before applying."

    - name: "Japan"
      code: "JP"
      currency: "JPY"
      immigration_dependant_guidance: "https://www.isa.go.jp/en/applications/procedures/zairyu_nintei10_19.html"
      dependant_visa_policy: "International doctoral students holding a College Student (Ryugaku) visa may sponsor spouse and children under a Dependent (Kazoku Taizai) status of residence."
      immigration_disclaimer: "Dependants appear eligible under current published Immigration Services Agency of Japan guidelines; verify requirements before applying."

    - name: "United States"
      code: "US"
      currency: "USD"
      immigration_dependant_guidance: "https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html"
      dependant_visa_policy: "Spouses and unmarried minor children of F-1/J-1 doctoral students are eligible for F-2 or J-2 derivative status. J-2 spouses may apply for work authorization (EAD)."
      immigration_disclaimer: "Dependants appear eligible under current published US Department of State visa regulations; verify requirements before applying."

  # Core Research Areas for Fit Evaluation
  research_areas:
    - "Edge Computing"
    - "Edge Intelligence"
    - "Edge AI"
    - "Distributed Systems"
    - "Distributed Computing"
    - "Cloud-Edge Continuum"
    - "Mobile Edge Computing"
    - "Fog Computing"
    - "Internet of Things"
    - "IoT"
    - "Federated Learning at the Edge"
    - "Distributed AI / ML"
    - "Computer Networks"
    - "Systems & Networking"
    - "Serverless Edge"
    - "TinyML"
    - "Resource Allocation and Scheduling"
    - "Computation Offloading"

  # Recruitment Detection Keywords & Weightings
  recruitment_keywords:
    active_signals:
      - "seeking phd students"
      - "seeking doctoral students"
      - "looking for phd students"
      - "looking for motivated phd students"
      - "accepting phd applications"
      - "accepting doctoral applications"
      - "recruiting phd students"
      - "recruiting doctoral students"
      - "open phd positions"
      - "open doctoral positions"
      - "funded phd position available"
      - "funded phd studentship available"
      - "phd studentships available"
      - "join my research group"
      - "join our research lab"
      - "prospective phd students"
      - "positions available for fall"
      - "positions available for spring"
    negative_signals:
      - "not accepting students"
      - "not taking phd students"
      - "not recruiting"
      - "group is currently full"
      - "lab is full"
      - "no open vacancies"
      - "no vacancies available"

  # Dependant Support Keywords for Classification
  dependant_support_keywords:
    financial_support: # Qualifies as "EXCELLENT" (Financial allowance specifically for dependants)
      - "family allowance"
      - "child allowance"
      - "child supplement"
      - "spouse allowance"
      - "dependant allowance"
      - "dependants allowance"
      - "family supplement"
      - "family accommodation provided"
      - "subsidized family housing"
      - "family health insurance"
      - "family healthcare included"
    permitted_support: # Qualifies as "GOOD" or "PERMITTED"
      - "dependant visa eligible"
      - "family visa eligible"
      - "spouse open work permit"
      - "spouse can work"
      - "dependants permitted"
      - "partner visa"
      - "family relocation"

  # Curated Authoritative Scholarships with Documented Dependant Support
  curated_scholarships:
    - name: "DAAD Doctoral Research Grants (One-Year / Complete Doctorate)"
      provider: "German Academic Exchange Service (DAAD)"
      country: "Germany"
      university: "Any accredited German University / Max Planck / Helmholtz"
      degree_level: "PhD / Doctorate"
      tuition_coverage: "Full tuition covered (most German universities have zero tuition)"
      stipend_amount: "€1,300 - €1,350 / month base stipend"
      duration: "Up to 3 - 4 years"
      deadline: "Varies by country (Typically October - November annually)"
      start_date: "October annually"
      dependant_support_classification: "excellent"
      dependant_support_details: "Monthly family allowance: ~€276/month spouse allowance + ~€204/month per child supplement. Subsidized health, accident, and liability insurance for accompanying family members."
      family_accommodation: "University guest houses / Studentenwerk family apartments available"
      international_eligibility: "eligible"
      official_url: "https://www2.daad.de/deutschland/stipendium/datenbank/en/21148-scholarship-database/"
      notes: "One of the most generous family-friendly international doctoral scholarship programs in the world."

    - name: "Gates Cambridge Scholarship (PhD Track)"
      provider: "Bill & Melinda Gates Foundation / University of Cambridge"
      country: "United Kingdom"
      university: "University of Cambridge"
      degree_level: "PhD"
      tuition_coverage: "Full Cambridge University Composition Fee covered"
      stipend_amount: "£21,000 / year maintenance allowance (tax-free)"
      duration: "Up to 4 years"
      deadline: "Early December (international) / October (US citizens)"
      start_date: "October annually"
      dependant_support_classification: "excellent"
      dependant_support_details: "Family Allowance: Up to £11,604/year for first child and up to £5,004/year for second child. Student Dependant Visa legally permitted."
      family_accommodation: "College family flats and university accommodation services available"
      international_eligibility: "eligible"
      official_url: "https://www.gatescambridge.org/programme/the-scholarship/"
      notes: "Provides comprehensive family maintenance allowance for accompanying children."

    - name: "Hong Kong PhD Fellowship Scheme (HKPFS)"
      provider: "Research Grants Council (RGC) of Hong Kong"
      country: "Hong Kong"
      university: "HKUST, HKU, CUHK, PolyU, CityU, HKBU, Lingnan, EdUHK"
      degree_level: "PhD"
      tuition_coverage: "Full tuition waiver / university subsidy"
      stipend_amount: "HK$331,200 / year (~HK$27,600 / month) + HK$13,800 annual travel allowance"
      duration: "Up to 3 - 4 years"
      deadline: "December 1 annually"
      start_date: "September annually"
      dependant_support_classification: "good"
      dependant_support_details: "Dependants (spouse and children under 18) are legally entitled to Dependant Visas with right to work and study. Substantial stipend is specifically calibrated to comfortably support an accompanying family in Hong Kong."
      family_accommodation: "Subsidized on-campus or university-managed family apartments"
      international_eligibility: "eligible"
      official_url: "https://cerg1.ugc.edu.hk/hkpfs/index.html"
      notes: "Extremely prestigious, high-stipend international fellowship scheme."

    - name: "Vanier Canada Graduate Scholarships (Vanier CGS)"
      provider: "Government of Canada (CIHR, NSERC, SSHRC)"
      country: "Canada"
      university: "Any participating Canadian Institution (Toronto, Waterloo, UBC, McGill, etc.)"
      degree_level: "PhD"
      tuition_coverage: "Institutional tuition waivers typically awarded alongside fellowship"
      stipend_amount: "CAD $50,000 / year"
      duration: "3 years"
      deadline: "October - November annually (via institutional nomination)"
      start_date: "May or September"
      dependant_support_classification: "good"
      dependant_support_details: "Spouse/partner is eligible for Canadian Spousal Open Work Permit (SOWP); minor children can study at Canadian public schools without study permit. CAD $50,000/yr stipend provides ample living allowance for family."
      family_accommodation: "University family housing communities available"
      international_eligibility: "eligible"
      official_url: "https://vanier.gc.ca/en/home-accueil.html"
      notes: "Canada's flagship doctoral award open to both domestic and international students."

    - name: "Japanese Government (MEXT) Doctoral Scholarship"
      provider: "Ministry of Education, Culture, Sports, Science and Technology (MEXT), Japan"
      country: "Japan"
      university: "Designated National Universities (University of Tokyo, Kyoto, Tokyo Tech, Osaka, etc.)"
      degree_level: "PhD"
      tuition_coverage: "Full tuition, admission, and examination fees waived"
      stipend_amount: "145,000 - 148,000 JPY / month + roundtrip airfare"
      duration: "Up to 3 - 4 years (including preparatory course if needed)"
      deadline: "Embassy track: April - May / University track: October - January"
      start_date: "April or October"
      dependant_support_classification: "permitted"
      dependant_support_details: "Spouses and children are eligible for Dependent (Kazoku Taizai) status of residence. National health insurance covers 70% of family medical costs with low monthly premiums for students."
      family_accommodation: "International student family dormitories available at most national universities"
      international_eligibility: "eligible"
      official_url: "https://www.studyinjapan.go.jp/en/planning/scholarships/mext-scholarships/"
      notes: "Comprehensive government sponsorship with guaranteed full tuition waiver."

    - name: "UKRI / EPSRC Doctoral Studentships"
      provider: "Engineering and Physical Sciences Research Council (EPSRC) / UKRI"
      country: "United Kingdom"
      university: "UK Universities (Oxford, Cambridge, Imperial, UCL, Edinburgh, Manchester, etc.)"
      degree_level: "PhD"
      tuition_coverage: "Full tuition fees covered (including international fees for funded quota)"
      stipend_amount: "£19,237+ / year (minimum UKRI rate, higher in London)"
      duration: "3.5 - 4 years"
      deadline: "Varies by project (Continuous / December - March)"
      start_date: "October annually"
      dependant_support_classification: "permitted"
      dependant_support_details: "PhD students on UKRI studentships are on Research Doctoral Student Visas and are legally entitled to bring spouse and children as dependants."
      family_accommodation: "University graduate family housing services"
      international_eligibility: "eligible"
      official_url: "https://www.ukri.org/what-we-do/developing-people-and-skills/find-studentships-and-doctoral-training/"
