    - name: "Fulbright Foreign Student Program (Doctoral Track)"
      provider: "U.S. Department of State"
      country: "United States"
      university: "Accredited U.S. Universities"
      degree_level: "PhD"
      tuition_coverage: "Full tuition and mandatory fees covered"
      stipend_amount: "Monthly maintenance stipend tailored to cost of living in study city"
      duration: "Up to 5 years (subject to academic progress and funding renewal)"
      deadline: "Varies by home country (Typically February - May annually)"
      start_date: "August - September annually"
      dependant_support_classification: "permitted"
      dependant_support_details: "Spouse and children are eligible for J-2 dependent visas. J-2 dependents may apply for Employment Authorization Document (EAD) to work in the US."
      family_accommodation: "University on-campus family student housing"
      international_eligibility: "eligible"
      official_url: "https://foreign.fulbrightonline.org/"
      notes: "Premier U.S. exchange program with full tuition and J-2 spouse work eligibility."
