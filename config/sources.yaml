# Discovery Sources Configuration by Credibility Tier

tier1_academic_and_standards:
  # Academic APIs
  - name: "arXiv CS.DC / CS.AI / CS.NI"
    type: "arxiv_api"
    enabled: true
    categories: ["cs.DC", "cs.NI", "cs.AI", "cs.SY"]
    query: 'all:"edge computing" OR all:"edge intelligence" OR all:"edge AI" OR all:"mobile edge computing"'
    max_results: 30
    credibility_weight: 1.0

  - name: "OpenAlex Works API"
    type: "openalex_api"
    enabled: true
    search_query: "edge computing OR edge intelligence OR mobile edge computing"
    max_results: 30
    credibility_weight: 1.0

  - name: "Crossref API (IEEE / ACM / Springer)"
    type: "crossref_api"
    enabled: true
    query: "edge computing edge intelligence"
    rows: 25
    credibility_weight: 1.0

  - name: "Semantic Scholar Graph API"
    type: "semantic_scholar_api"
    enabled: true
    query: "edge computing resource allocation offloading"
    limit: 25
    credibility_weight: 1.0

  # Standards RSS Feeds
  - name: "ETSI Standards RSS"
    type: "rss"
    enabled: true
    url: "https://www.etsi.org/newsroom/news?format=feed&type=rss"
    credibility_weight: 1.0
    category: "standards"

  - name: "NIST Computer Security / IoT RSS"
    type: "rss"
    enabled: true
    url: "https://www.nist.gov/news-events/news/rss.xml"
    credibility_weight: 1.0
    category: "standards"

  - name: "Linux Foundation / LF Edge Blog"
    type: "rss"
    enabled: true
    url: "https://www.lfedge.org/feed/"
    credibility_weight: 0.9
    category: "open_source_standards"

  - name: "CNCF (Cloud Native Computing Foundation) Blog"
    type: "rss"
    enabled: true
    url: "https://www.cncf.io/feed/"
    credibility_weight: 0.9
    category: "cloud_native"

