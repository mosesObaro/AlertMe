    - "Neural Networks"
    - "Reinforcement Learning"
    - "Microcontrollers"
    - "Real-Time Systems"
    - "Robotics"
    - "Wireless Sensor Networks"
    - "Edge Computing"
    - "Distributed Systems"
    - "FPGA"
    - "ASIC"
    - "Hardware Acceleration"
    - "Model Compression"
    - "Quantization"
    - "Sensor Fusion"
  training_keywords:
    - "Bootcamp"
    - "Summer School"
    - "Winter School"
    - "Training Program"
    - "Hands-on Workshop"
    - "Tutorial"
    - "Masterclass"
    - "Doctoral Symposium"
    - "Doctoral Consortium"
