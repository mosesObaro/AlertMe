    - "student registration"
    - "student ticket"
    - "student discount"
    - "acm student member"
    - "ieee student member"
    - "graduate student"
    - "postgraduate"
  travel_grant_keywords:
    - "travel grant"
    - "student travel grant"
    - "stg"
    - "travel award"
    - "nsf travel grant"
    - "acm sigbed travel grant"
    - "acm sigmobile travel grant"
    - "ieee travel grant"
    - "travel stipend"
