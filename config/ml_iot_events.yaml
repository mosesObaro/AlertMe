    - "Deep Learning"
    - "Neural Information Processing"
    - "Neural Networks"
    - "Embedded Systems"
    - "Internet of Things"
    - "IoT"
    - "TinyML"
    - "Embedded AI"
    - "Edge AI"
    - "Computer Vision"
    - "Intelligent IoT"
    - "Cyber-Physical Systems"
    - "Sensor Networks"
    - "IoT Networks"
    - "AI Systems"
    - "Low-Power ML"
