# Major Conferences Relevant to Edge Computing & Distributed Systems

conferences:
  - name: "ACM SEC (Symposium on Edge Computing)"
    acronym: "SEC"
    organizer: "ACM / IEEE"
    tier: 1
    topics: ["Edge Computing", "Edge AI", "Cloudlets", "Edge Security", "Edge Networking"]
    website: "https://acm-ieee-sec.org"
    typical_deadline_month: 6

  - name: "IEEE INFOCOM"
    acronym: "INFOCOM"
    organizer: "IEEE"
    tier: 1
    topics: ["Edge Networks", "MEC", "Resource Allocation", "Distributed Algorithms", "5G/6G"]
    website: "https://infocom.ieee.org"
    typical_deadline_month: 7

  - name: "ACM MobiCom"
    acronym: "MobiCom"
    organizer: "ACM SIGMOBILE"
    tier: 1
    topics: ["Mobile Computing", "Edge AI", "Wireless Edge", "MEC", "Offloading"]
    website: "https://sigmobile.org/mobicom"
    typical_deadline_month: 3

  - name: "USENIX ATC (Annual Technical Conference)"
    acronym: "USENIX ATC"
    organizer: "USENIX"
    tier: 1
    topics: ["Distributed Systems", "Operating Systems", "Edge/Cloud Infrastructure", "Storage"]
    website: "https://www.usenix.org/conference/atc"
    typical_deadline_month: 1

  - name: "USENIX NSDI (Networked Systems Design and Implementation)"
    acronym: "NSDI"
    organizer: "USENIX"
    tier: 1
    topics: ["Networked Systems", "Edge Networks", "Data Centers", "Distributed AI Infrastructure"]
    website: "https://www.usenix.org/conference/nsdi"
    typical_deadline_month: 9

  - name: "IEEE ICDCS (International Conference on Distributed Computing Systems)"
    acronym: "ICDCS"
    organizer: "IEEE"
    tier: 1
    topics: ["Distributed Systems", "Edge Computing", "Fog Computing", "Cloud Computing", "Federated Learning"]
    website: "https://icdcs.org"
    typical_deadline_month: 12

  - name: "ACM EdgeSys (International Workshop on Edge Systems, Analytics and Networking)"
    acronym: "EdgeSys"
    organizer: "ACM EuroSys Workshop"
    tier: 2
    topics: ["Edge Systems", "Edge Analytics", "TinyML", "Edge Benchmarking"]
    website: "https://edgesys.org"
    typical_deadline_month: 1

  - name: "IEEE SECON (Sensing, Communication, and Networking)"
    acronym: "SECON"
    organizer: "IEEE"
    tier: 2
    topics: ["IoT", "Edge Sensing", "Edge Machine Learning", "Wireless Networks"]
    website: "https://secon.ieee.org"
    typical_deadline_month: 2

  - name: "IEEE CLOUD"
    acronym: "IEEE CLOUD"
    organizer: "IEEE"
    tier: 2
    topics: ["Cloud Computing", "Edge-Cloud Collaboration", "Serverless", "Microservices"]
    website: "https://cloud.ieee.org"
    typical_deadline_month: 3

  - name: "ACM SenSys"
    acronym: "SenSys"
    organizer: "ACM SIGMOBILE"
    tier: 1
    topics: ["Embedded Sensing", "TinyML", "Edge AI", "IoT Systems"]
    website: "https://sensys.acm.org"
    typical_deadline_month: 4
